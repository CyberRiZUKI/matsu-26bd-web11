<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>松田里奈生贺</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top">
    <a class="home" href="index.html">主页</a>
    <a href="chat.html">粉丝互动</a>
    <a class="active" href="journal.html">综艺热度</a>
    <a href="mediavariety.html">音乐音番</a>
    <a href="map.html">巡礼地图</a>
    <a href="blog.html">博客收据</a>
    <a href="disclaimer.html">钞组资讯</a>
</nav>

<main>
    <h1>综艺热度表</h1>

    <div class="tv" id="tv">
        <div class="tv-body">

            <div class="tv-screen">
                <div class="tv-hint">▶ PRESS POWER</div>

                <div class="tv-content">
                    <!-- heatmap box -->
                    <div class="box" id="heat-box" style="display:none">
                        <div id="heat-scroll">
                            <div id="heat-months"></div>
                            <div id="heat"></div>
                        </div>
                        <div id="heat-legend">
                            LESS <i class="lv0"></i><i class="lv1"></i><i class="lv2"></i><i class="lv3"></i><i class="lv4"></i> MORE
                        </div>
                    </div>

                    <!-- controls box -->
                    <div class="box">
                        <p id="j-status">LOADING JOURNAL...</p>
                        <div id="j-controls" style="display:none">
                            <label>YEAR <select id="j-year"></select></label>
                            <div id="j-sheets"></div>
                        </div>
                    </div>
                </div>

                <div class="tv-flash"></div>
            </div>

            <div class="tv-panel">
                <div class="tv-led"></div>
                <div class="tv-grille"></div>

                <div class="tv-scroll">
                    <button class="tv-arrow left"  id="tv-left"  type="button" aria-label="Scroll left"></button>
                    <button class="tv-arrow right" id="tv-right" type="button" aria-label="Scroll right"></button>
                </div>

                <button class="tv-power" id="tv-power" type="button" aria-label="Power" aria-pressed="true">PWR</button>
            </div>
        </div>

        <div class="tv-legs"><i></i><i></i></div>
    </div>

    <div class="box" id="detail-box" style="display:none">
        <h2 id="detail-title"></h2>
        <button class="btn" id="show-all">SHOW WHOLE YEAR ▶</button>
        <div id="detail"></div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="journal.js"></script>

<script>
    /* TV power button: off and on again */
    (() => {
        const tv = document.getElementById("tv");
        const btn = document.getElementById("tv-power");
        btn.addEventListener("click", () => {
            const off = tv.classList.toggle("off");
            btn.setAttribute("aria-pressed", String(!off));
        });
    })();
</script>
</body>
</html>
